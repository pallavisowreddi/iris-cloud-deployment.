<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iris Flower Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 430px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Iris Flower Prediction</h2>
        <p>Enter measurements in centimeters.</p>

        <form method="POST" action="/">
            <input type="number" step="any" min="0"
                   name="sepal_length"
                   placeholder="Sepal Length" required>

            <input type="number" step="any" min="0"
                   name="sepal_width"
                   placeholder="Sepal Width" required>

            <input type="number" step="any" min="0"
                   name="petal_length"
                   placeholder="Petal Length" required>

            <input type="number" step="any" min="0"
                   name="petal_width"
                   placeholder="Petal Width" required>

            <button type="submit">Predict Species</button>
        </form>

        {% if prediction %}
            <h3 class="result">Predicted Species: {{ prediction }}</h3>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
